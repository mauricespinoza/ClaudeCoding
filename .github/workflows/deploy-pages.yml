# Un sitio de GitHub Pages sólo admite un despliegue a la vez: este workflow
# construye todas las apps del repo y las publica juntas, cada una en su subruta.
name: Deploy web apps to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/webapp-geologia-estructural-y7fbm8
      - claude/geolocalized-photo-management-app-bgf86c
    paths:
      - 'geophoto/**'
      - 'estructural/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build GeoPhoto Studio
        working-directory: geophoto
        env:
          GITHUB_PAGES: 'true'
        run: |
          npm ci
          npm run build

      - name: Build GeoEstructura
        working-directory: estructural
        env:
          GITHUB_PAGES: 'true'
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir -p _site/geophoto _site/estructural
          cp -r geophoto/dist/. _site/geophoto/
          cp -r estructural/dist/. _site/estructural/
          cp .github/pages-index.html _site/index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
