name: Deploy GeoPhoto Studio to GitHub Pages

on:
  push:
    branches: [claude/geolocalized-photo-management-app-bgf86c, main]
    paths:
      - 'geophoto/**'
      - '.github/workflows/deploy-geophoto.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: geophoto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: geophoto/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      # Se sirve bajo /geophoto/ para dejar libre la raíz del sitio de Pages
      # (por si más adelante también se publica app/ en el mismo sitio).
      - run: |
          mkdir -p _site/geophoto
          cp -r dist/. _site/geophoto/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: geophoto/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
